[package]
name         = "whistle-train"
description  = "Fine-tune Cactus Whistle with LoRA: sweeps, live evaluation with the Rust engine, and a training TUI"
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
license.workspace      = true
repository.workspace   = true
publish      = false

[dependencies]
cactus-whistle = { path = "../whistle", features = ["std"] }
cactus-whistle-common = { path = "../common" }
crossterm = "0.29.0"
ratatui = "0.30.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[[bin]]
name = "whistle-train"
path = "src/main.rs"
