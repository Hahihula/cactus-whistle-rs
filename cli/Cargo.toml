[package]
name         = "cactus-whistle-cli"
description  = "Desktop tools for the cactus-whistle engine: transcribe, trim and inspect models"
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
license.workspace      = true
repository.workspace   = true
publish      = false

[dependencies]
cactus-whistle = { path = "../whistle", features = ["std"] }
# Desktop only: decoding audio files of any common format, microphone input.
symphonia = { version = "0.6", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "pcm", "aac", "isomp4"] }
cpal = "0.18"
libm = "0.2"
safetensors = "0.8.0"
serde_json = "1.0.154"
serde = "1.0.229"

[[bin]]
name = "whistle"
path = "src/main.rs"
