[package]
name         = "cactus-whistle-cli"
description  = "Desktop tools for the cactus-whistle engine: transcribe, trim and inspect models"
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
license.workspace      = true
repository.workspace   = true
publish      = false

[dependencies]
cactus-whistle = { path = "../whistle", features = ["std"] }
# Audio files, adapters, datasets and WER, shared with whistle-train.
cactus-whistle-common = { path = "../common" }
serde_json = "1.0.154"
# Desktop only: microphone input.
cpal = "0.18"

[[bin]]
name = "whistle"
path = "src/main.rs"
